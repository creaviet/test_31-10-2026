# ---------------------------------------------------------------------------
# Kundenportal-Prototyp — deutsche Texte (Feinabstimmung).
#
# Keycloak erbt ALLE Nachrichten aus dem Parent-Theme; hier werden nur einzelne
# Schlüssel überschrieben. Die Formulierungen folgen der Sprache des Portals
# (portal-mock/public/index.html): „Sichere Anmeldemethode einrichten".
#
# Gilt nur, wenn die Sprache Deutsch ist (Realm: defaultLocale=de).
# ---------------------------------------------------------------------------

# Kopfzeile der Standard-Login-Seite (portal-bootstrap / Konsolen-Login)
loginAccountTitle=Anmeldung am Kundenportal

# Passkey-Anmeldung (login-webauthn-authenticator)
webauthn-login-title=Anmeldung mit Passkey
webauthn-doAuthenticate=Mit Passkey anmelden
webauthn-passwordless-help-text=Melden Sie sich mit Ihrem Passkey an – ohne Passwort.

# Passkey-Einrichtung (Required Action webauthn-register-passwordless)
webauthn-registration-title=Sichere Anmeldemethode einrichten
doRegisterSecurityKey=Sichere Anmeldemethode einrichten
