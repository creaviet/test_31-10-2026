# ---------------------------------------------------------------------------
# Kundenportal-Prototyp — Custom Login-Theme (Keycloak 26.7.x)
# ---------------------------------------------------------------------------
# Deckt ALLE Login-Seiten des Realms ab, insbesondere:
#   - Passkey-Anmeldung   (login-webauthn-authenticator  → #authenticateWebAuthnButton)
#   - Passkey-Registrierung (Required Action webauthn-register-passwordless
#                          → webauthn-register → #registerWebAuthn)
#   - Standard-Login/Registrierung (portal-bootstrap)
#
# DESIGN: Es werden BEWUSST KEINE Freemarker-Templates überschrieben. Dadurch
# bleiben die stabilen Element-IDs/Gates der Passkey-Seiten erhalten (die
# E2E-Suite tests/e2e.spec.js klickt #registerWebAuthn und
# #authenticateWebAuthnButton). Angepasst wird ausschließlich das Aussehen (CSS),
# die Sprache und einzelne Texte.
#
# WICHTIG (Keycloak-Theming): Die Property "styles" wird NICHT vom Parent geerbt.
# Deshalb wird das Stylesheet des Parents (css/login.css) erneut gelistet und das
# eigene Stylesheet ZULETZT angehängt — so überschreibt es gezielt einzelne Regeln.
# (css/login.css liegt im Parent-Theme und wird über die Theme-Hierarchie aufgelöst.)
parent=keycloak

styles=css/login.css css/kundenportal.css

# Verfügbare Sprachen des Themes. Deutsch ist im Distribution-Theme enthalten
# (Community-Übersetzungen des Base-Themes); messages_de.properties dieses Themes
# überschreibt einzelne Formulierungen (siehe login/messages/).
locales=de,en
