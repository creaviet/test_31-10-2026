<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="1000" fill="white"/>
  
  <!-- SAP Box -->
  <rect x="350" y="20" width="140" height="60" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="420" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">SAP</text>
  <text x="420" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(Stammdaten) (vgv)</text>
  
  <!-- Sync label -->
  <text x="420" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">täglich gesynct</text>
  
  <!-- Arrow SAP to SQL -->
  <line x1="420" y1="80" x2="420" y2="120" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- SQL Box -->
  <rect x="350" y="120" width="140" height="50" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="420" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">SQL(vgv)</text>
  
  <!-- Arrow SQL to Backup -->
  <line x1="490" y1="145" x2="560" y2="145" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backup Circle -->
  <circle cx="620" cy="145" r="35" fill="white" stroke="black" stroke-width="2"/>
  <text x="620" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Backup</text>
  
  <!-- Arrow Backup to AWS container -->
  <line x1="655" y1="145" x2="720" y2="145" stroke="black" stroke-width="2"/>
  <line x1="720" y1="145" x2="720" y2="60" stroke="black" stroke-width="2"/>
  <line x1="720" y1="60" x2="780" y2="60" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- AWS Container -->
  <rect x="700" y="20" width="180" height="220" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="790" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">AWS von "just relate"</text>
  
  <!-- EC2 Box -->
  <rect x="750" y="60" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="790" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">EC2</text>
  
  <!-- Arrow EC2 to API -->
  <line x1="790" y1="100" x2="790" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- API Box -->
  <rect x="750" y="130" width="80" height="40" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="790" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">API</text>
  
  <!-- Arrow API to BE -->
  <line x1="790" y1="170" x2="790" y2="260" stroke="black" stroke-width="2"/>
  <line x1="790" y1="260" x2="480" y2="260" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- BE Box -->
  <rect x="350" y="260" width="260" height="60" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="480" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">BE</text>
  <text x="480" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(AWS+ASP.NET+REST.API+SQL)</text>
  
  <!-- Arrow BE to FE -->
  <line x1="480" y1="320" x2="480" y2="370" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- FE Box -->
  <rect x="350" y="370" width="260" height="50" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="480" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">FE</text>
  <text x="480" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(scrivito)</text>
  
  <!-- Arrow FE split -->
  <line x1="480" y1="420" x2="480" y2="460" stroke="black" stroke-width="2"/>
  <line x1="480" y1="460" x2="380" y2="460" stroke="black" stroke-width="2"/>
  <line x1="480" y1="460" x2="580" y2="460" stroke="black" stroke-width="2"/>
  <line x1="380" y1="460" x2="380" y2="510" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="460" x2="580" y2="510" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Verimi Box -->
  <rect x="310" y="510" width="140" height="50" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="380" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">verimi</text>
  <text x="380" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(einloggen)</text>
  
  <!-- Adesso Box -->
  <rect x="510" y="510" width="140" height="50" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="580" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Adesso</text>
  <text x="580" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(einloggen)</text>
  
  <!-- Note: Verimi soll ersetzt werden -->
  <rect x="50" y="480" width="180" height="50" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="140" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Verimi soll ersetzt</text>
  <text x="140" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">werden</text>
  
  <!-- Note connector -->
  <line x1="230" y1="505" x2="310" y2="535" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Merge arrows to Browser -->
  <line x1="380" y1="560" x2="380" y2="600" stroke="black" stroke-width="2"/>
  <line x1="580" y1="560" x2="580" y2="600" stroke="black" stroke-width="2"/>
  <line x1="380" y1="600" x2="480" y2="600" stroke="black" stroke-width="2"/>
  <line x1="580" y1="600" x2="480" y2="600" stroke="black" stroke-width="2"/>
  <line x1="480" y1="600" x2="480" y2="640" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Browser Box -->
  <rect x="350" y="640" width="260" height="70" fill="white" stroke="black" stroke-width="2" rx="5"/>
  <text x="480" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Browser</text>
  <text x="480" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(Client)</text>
  <text x="480" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">500-1000 User/Monat</text>
</svg>
